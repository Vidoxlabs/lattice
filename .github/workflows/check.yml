name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser stage installs Chromium and WebKit itself, with the system
      # packages this runner can install as root, and fails if either cannot
      # start. No separate install step: one code path for every build.
      - run: npm run check
        env:
          CI: '1'
      # The exact output this run verified is what the deploy job publishes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: lattice-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
