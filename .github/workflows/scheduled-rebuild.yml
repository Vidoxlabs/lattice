name: scheduled-rebuild

# Rebuilds the site once a day until the documentation repository can notify it
# after a sync. It posts to a Workers Builds deploy hook held as the repository
# secret LATTICE_DEPLOY_HOOK_URL, and it is a no-op with a notice when that
# secret is absent, so committing it changes nothing by itself. Delete this
# workflow once the documentation repository notifies the site on its own.

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    name: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask for a rebuild when the hook exists
        env:
          HOOK: ${{ secrets.LATTICE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::notice title=Rebuild skipped::No deploy hook is configured, so nothing was rebuilt. SETUP.md section 3 carries the owner step."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST "$HOOK" || true)
          echo "The deploy hook answered ${status:-nothing}."
          case "$status" in
            2*) ;;
            *) echo "::error title=Rebuild failed::The deploy hook answered ${status:-nothing}."; exit 1 ;;
          esac
